<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>老师与管理员登录 — 春日部托管</title>
<link rel="stylesheet" href="css/common.css?v=integrated-1">
</head>
<body class="adm-login-page">
<main class="adm-login-card">
<h1>老师与管理员登录</h1>
<p class="adm-login-sub">一个账号管理学生、作业、每日反馈与错题。使用已开通的作业管理账号，权限由系统核验。</p>
<form id="adminLogin">
<div class="adm-form-group">
<label for="username">账号</label>
<input id="username" class="adm-form-input" autocomplete="username" required maxlength="128">
</div>
<div class="adm-form-group">
<label for="password">密码</label>
<input id="password" class="adm-form-input" type="password" autocomplete="current-password" required>
</div>
<button id="btnLogin" class="adm-btn adm-btn-primary adm-btn-block" type="submit">登录后台</button>
</form>
<p id="loginStatus" role="status" aria-live="polite">
</p>
<p>如提示未关联或停用，请联系负责人核对账号权限。</p>
</main>
<script src="../js/cloudbase-v3.10.0.full.min.js">
</script>
<script src="js/homework-config.js?v=integrated-1">
</script>
<script src="js/homework-api.js?v=integrated-1">
</script>
<script src="js/auth.js?v=integrated-1">
</script>
<script src="js/login.js?v=integrated-1">
</script>
</body>
</html>
