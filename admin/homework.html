<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="referrer" content="no-referrer">
  <title>作业工作台 — 老师后台</title>
  <link rel="stylesheet" href="css/common.css">
  <link rel="stylesheet" href="css/homework.css">
</head>
<body class="adm-layout">
  <aside class="adm-sidebar" id="sidebar">
    <div class="adm-sidebar-brand">老师后台</div>
    <nav class="adm-sidebar-nav" id="sidebarNav" aria-label="老师后台导航"></nav>
  </aside>
  <main class="adm-main">
    <header class="adm-topbar">
      <button class="adm-sidebar-toggle" id="sidebarToggle" aria-label="切换导航" aria-expanded="false">☰</button>
      <strong>作业工作台</strong><span class="adm-topbar-info" id="topbarInfo"></span>
    </header>
    <div class="adm-content hw-content">
      <div class="hw-heading"><div><p><a href="homework-classes.html">作业班级管理</a> › 作业工作台</p><h1>班级作业清单</h1><p>先选班级，再逐项录入作业；学生完成一项后，在对应作业后勾选。</p></div><span class="hw-readonly">班级模式</span></div>
      <section class="adm-card hw-login" id="loginPanel" hidden>
        <h2>验证作业访问权限</h2>
        <p>请输入已开通作业权限的账号。原后台登录不会自动获得作业权限。</p>
        <form id="homeworkLogin">
          <label class="adm-form-label" for="homeworkUsername">作业访问账号</label>
          <input class="adm-form-input" id="homeworkUsername" autocomplete="username" required maxlength="128">
          <label class="adm-form-label" for="homeworkPassword">密码</label>
          <input class="adm-form-input" id="homeworkPassword" type="password" autocomplete="current-password" required>
          <button class="adm-btn adm-btn-primary" id="loginButton" type="submit">验证并进入</button>
        </form>
      </section>
      <div id="homeworkStatus" role="status" aria-live="polite"></div>
      <button id="retryButton" class="adm-btn adm-btn-secondary" hidden>重新加载</button>
      <section id="workspacePanel" hidden>
        <div class="adm-card hw-controls">
          <label for="classSelect">班级<select id="classSelect" class="adm-form-select"></select></label>
          <label for="dateSelect">查看日期<input type="date" id="dateSelect" class="adm-form-input"></label>
          <button id="refreshButton" class="adm-btn adm-btn-secondary">刷新</button>
          <a class="adm-btn adm-btn-secondary" href="homework-classes.html">返回班级管理</a>
          <a id="classStudentsLink" class="adm-btn adm-btn-secondary" href="homework-students.html">本班学生</a>
        </div>
        <section class="adm-card hw-book-panel">
          <h2>一次录入多项作业</h2>
          <form id="bookForm" class="hw-book-form">
            <div class="hw-book-target">
              <label for="bookTarget">布置范围<select id="bookTarget" class="adm-form-select"><option value="class">当前班级全部启用学生</option><option value="student">单个学生</option></select></label>
              <label id="bookStudentLabel" for="bookStudent">学生<select id="bookStudent" class="adm-form-select" required></select></label>
            </div>
            <div id="bookItems" class="hw-book-items">
              <fieldset class="hw-book-item" data-book-item><legend>第 1 项作业</legend>
                <div class="hw-book-item-main">
                  <label>作业名称<input id="bookName" data-book-field="name" class="adm-form-input" maxlength="100" required placeholder="例如：数学练习"></label>
                  <label>对应数量<input id="bookTotal" data-book-field="totalAmount" class="adm-form-input" type="number" min="1" max="1000000" step="1" required></label>
                  <label>单位<input id="bookUnit" data-book-field="unit" class="adm-form-input" maxlength="16" value="页" required></label>
                  <button class="adm-btn adm-btn-secondary hw-remove-item" type="button" data-remove-book hidden>移除</button>
                </div>
                <details class="hw-book-advanced"><summary>更多设置</summary><div>
                  <label>科目<input id="bookSubject" data-book-field="subject" class="adm-form-input" maxlength="32" value="other" required></label>
                  <label>单位负载<input id="bookWorkload" data-book-field="workloadPerUnit" class="adm-form-input" type="number" min="1" max="1000000" step="1" value="5" required></label>
                </div></details>
              </fieldset>
            </div>
            <div class="hw-book-actions"><button id="addBookItemButton" class="adm-btn adm-btn-secondary" type="button">＋ 添加一项作业</button><button id="createBookButton" class="adm-btn adm-btn-primary" type="submit">一次保存全部作业</button></div>
          </form>
          <p class="hw-muted">每行的名称、数量和单位一一对应。全班录入会为每名启用学生分别创建这些作业本；不会自动生成或重建计划。</p>
        </section>
        <div id="homeworkSummary" class="hw-summary" aria-live="polite"></div>
        <div id="studentCards" class="hw-cards"></div>
      </section>
    </div>
  </main>
  <script src="../js/cloudbase-v3.10.0.full.min.js"></script>
  <script src="js/homework-config.js"></script>
  <script src="js/homework-api.js"></script>
  <script src="js/common.js"></script>
  <script src="js/homework.js"></script>
</body>
</html>
