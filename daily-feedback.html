  <!-- 页面标题 -->
  <section class="df-hero">
    <div class="container">
      <h1 class="df-hero-title">每日成长反馈</h1>
      <p class="df-hero-subtitle">每天记录孩子的成长，让家长随时了解孩子在托班的学习与生活。</p>
    </div>
  </section>

  <!-- 第一部分：查询区域 -->
  <section class="df-query-section" id="querySection">
    <div class="container">
      <div class="df-query-card">
        <h2>查看孩子每日反馈</h2>
        <p class="df-query-desc">请输入家长手机号查询孩子成长记录。</p>
        <div class="df-query-row">
          <input type="tel" id="phoneInput" placeholder="手机号" maxlength="11" autocomplete="tel">
          <button class="btn btn-primary" id="queryBtn"><i class="fas fa-search"></i> 立即查询</button>
        </div>
      </div>
    </div>
  </section>

  <!-- 第二部分：成长记录 -->
  <section id="reportSection" style="display:none;"></section>

  <!-- 第三部分：历史记录 -->
  <section class="df-history-section" id="historySection" style="display:none;">
    <div class="container">
      <h2 class="df-history-title"><i class="fas fa-history"></i> 成长记录</h2>
      <div class="df-timeline" id="historyList"></div>
    </div>
  </section>

  <!-- 页脚 -->

      <div class="footer-inner">
